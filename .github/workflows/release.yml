name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo test --locked --all-targets --all-features
      - run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Archive Unix binary
        if: runner.os != 'Windows'
        shell: bash
        run: |
          archive="scas-${GITHUB_REF_NAME}-${{ matrix.target }}.tar.gz"
          tar -C "target/${{ matrix.target }}/release" -czf "$archive" scas
      - name: Archive Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "target/${{ matrix.target }}/release/scas.exe" -DestinationPath "scas-${env:GITHUB_REF_NAME}-${{ matrix.target }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: scas-${{ matrix.target }}
          path: scas-${{ github.ref_name }}-${{ matrix.target }}.*
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: scas-${{ github.ref_name }}-${{ matrix.target }}.*

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: scas-*
          merge-multiple: true
          path: dist
      - name: Create checksums
        run: cd dist && sha256sum scas-* > SHA256SUMS
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --verify-tag --generate-notes
