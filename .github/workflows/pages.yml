name: Browser IDE

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Check the shared language core
        run: cargo check --locked --lib --target wasm32-unknown-unknown
      - name: Install matching wasm-bindgen CLI
        run: cargo install wasm-bindgen-cli --version 0.2.100 --locked
      - name: Build browser IDE
        run: bash scripts/build-web.sh
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install browser smoke test tools
        run: |
          npm install --prefix "$RUNNER_TEMP/scas-browser" playwright@1.64.1
          "$RUNNER_TEMP/scas-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Verify the browser IDE launches under a project subdirectory
        run: |
          python3 -m http.server 8080 --bind 127.0.0.1 > "$RUNNER_TEMP/scas-http.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          SCAS_SMOKE_MODE=launch NODE_PATH="$RUNNER_TEMP/scas-browser/node_modules" node scripts/check-web-browser.cjs
      - name: Run extended browser regression checks
        continue-on-error: true
        run: |
          python3 -m http.server 8080 --bind 127.0.0.1 > "$RUNNER_TEMP/scas-http.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          NODE_PATH="$RUNNER_TEMP/scas-browser/node_modules" node scripts/check-web-browser.cjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
