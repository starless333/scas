[package]
name = "scas"
version = "0.1.0"
edition = "2021"
rust-version = "1.79"
description = "An exact-arithmetic scripting language and symbolic computer algebra system"
license = "MIT"
repository = "https://github.com/starless333/scas"
homepage = "https://github.com/starless333/scas"
documentation = "https://docs.rs/scas"
readme = "README.md"
keywords = ["computer-algebra", "symbolic-math", "mathematics", "interpreter"]
categories = ["science::mathematics", "command-line-utilities"]

[dependencies]
bigdecimal = "0.4"
dashu-cmplx = "=0.6.1"
dashu-float = "=0.6.1"
eframe = { version = "0.28", optional = true, default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
image = { version = "0.25.6", optional = true, default-features = false, features = ["png"] }
num-bigint = "0.4"
num-integer = "0.1"
num-rational = "0.4"
num-traits = "0.2"
serde = { version = "1", optional = true, features = ["derive"] }
toml = { version = "0.8", optional = true }

[features]
default = []
gui = ["dep:eframe", "dep:image", "dep:serde", "dep:toml"]

[[bin]]
name = "scas-gui"
path = "src/bin/scas-gui.rs"
required-features = ["gui"]

[[bench]]
name = "baselines"
harness = false
