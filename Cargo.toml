[package]
name = "scas"
default-run = "scas"
version = "0.1.0"
edition = "2021"
rust-version = "1.79"
description = "An exact-arithmetic scripting language and symbolic computer algebra system"
license = "MIT"
repository = "https://github.com/starless333/scas"
homepage = "https://github.com/starless333/scas"
documentation = "https://docs.rs/scas"
readme = "README.md"
keywords = ["computer-algebra", "symbolic-math", "mathematics", "interpreter"]
categories = ["science::mathematics", "command-line-utilities"]

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
bigdecimal = "0.4"
dashu-cmplx = "=0.6.1"
dashu-float = "=0.6.1"
eframe = { version = "0.28", optional = true, default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
image = { version = "0.25.6", optional = true, default-features = false, features = ["png"] }
js-sys = { version = "=0.3.77", optional = true }
portable-pty = { version = "=0.8.1", optional = true }
num-bigint = "0.4"
num-integer = "0.1"
num-rational = "0.4"
num-traits = "0.2"
serde = { version = "1", optional = true, features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
tokio = { version = "1", optional = true, features = ["rt-multi-thread", "macros", "io-std", "sync"] }
toml = { version = "0.8", optional = true }
tower-lsp = { version = "=0.20.0", optional = true }
vt100 = { version = "=0.15.2", optional = true }
wasm-bindgen = { version = "=0.2.100", optional = true }
wasm-bindgen-futures = { version = "=0.4.50", optional = true }
web-sys = { version = "=0.3.77", optional = true, features = ["Window", "Location", "Storage", "Worker", "MessageEvent", "EventTarget", "Document", "Element"] }

[features]
default = []
gui = ["dep:eframe", "dep:image", "dep:portable-pty", "dep:serde", "dep:toml", "dep:vt100"]
lsp = ["dep:tokio", "dep:tower-lsp"]
web = ["dep:eframe", "dep:js-sys", "dep:serde", "dep:wasm-bindgen", "dep:wasm-bindgen-futures", "dep:web-sys"]

[[bin]]
name = "scas-gui"
path = "src/bin/scas-gui.rs"
required-features = ["gui"]

[[bin]]
name = "scas-lsp"
path = "src/bin/scas-lsp.rs"
required-features = ["lsp"]

[[bench]]
name = "baselines"
harness = false
